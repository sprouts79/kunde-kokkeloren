<!doctype html>
<html lang="no"><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#F1EDE2;color:#31261D;font-family:var(--kl-sans);}
.wrap{padding:20px 24px;display:flex;flex-direction:column;gap:6px;}
.row{display:flex;align-items:center;gap:10px;}
.b{background:#31261D;height:14px;border-radius:2px;}
.l{font:var(--kl-caption);font-family:var(--kl-mono);min-width:62px;color:var(--kl-muted);}
</style></head>
<body><div class="wrap">
  <div class="row"><div class="l">4 · 1</div><div class="b" style="width:4px"></div></div>
  <div class="row"><div class="l">8 · 2</div><div class="b" style="width:8px"></div></div>
  <div class="row"><div class="l">12 · 3</div><div class="b" style="width:12px"></div></div>
  <div class="row"><div class="l">16 · 4</div><div class="b" style="width:16px"></div></div>
  <div class="row"><div class="l">24 · 5</div><div class="b" style="width:24px"></div></div>
  <div class="row"><div class="l">32 · 6</div><div class="b" style="width:32px"></div></div>
  <div class="row"><div class="l">48 · 7</div><div class="b" style="width:48px"></div></div>
  <div class="row"><div class="l">64 · 8</div><div class="b" style="width:64px"></div></div>
  <div class="row"><div class="l">96 · 9</div><div class="b" style="width:96px"></div></div>
  <div class="row"><div class="l">128 · 10</div><div class="b" style="width:128px"></div></div>
</div></body></html>
