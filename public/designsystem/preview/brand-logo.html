<!doctype html>
<html lang="no"><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;font-family:var(--kl-sans);}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:220px;}
.a{background:#F1EDE2;}
.b{background:#31261D;}
.cell{display:flex;flex-direction:column;justify-content:space-between;padding:22px;}
.cell img{height:48px;width:auto;align-self:flex-start;}
.cell .lbl{font:var(--kl-caption);font-family:var(--kl-mono);color:var(--kl-muted);}
.b .lbl{color:rgba(241,237,226,.7);}
</style></head>
<body><div class="wrap">
  <div class="cell a"><img src="../assets/logos/logo-black.png" alt="Kokkeløren"><div class="lbl">Positiv · Black på White</div></div>
  <div class="cell b"><img src="../assets/logos/logo-white.png" alt="Kokkeløren"><div class="lbl">Negativ · White på Black / foto</div></div>
</div></body></html>
