<!doctype html>
<html lang="no"><head><meta charset="utf-8"><title>Type — families</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#F1EDE2;color:#31261D;}
.wrap{padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.col h4{font:var(--kl-overline);margin:0 0 6px;letter-spacing:.14em;}
.s{font-family:var(--kl-serif);font-size:28px;line-height:1.1;margin:0;}
.s i{font-style:italic;}
.f{font-family:var(--kl-sans);font-size:18px;line-height:1.4;margin:6px 0 0;font-weight:300;}
.f b{font-weight:500;}
.m{font-family:var(--kl-mono);font-size:14px;margin-top:8px;color:var(--kl-muted);}
</style></head>
<body><div class="wrap">
  <div class="col">
    <h4>Valizas · titler</h4>
    <p class="s">Kokkeløren <i>smaker</i></p>
    <p class="m">Regular / Italic · 24–96 px</p>
  </div>
  <div class="col">
    <h4>GT Flexa · brødtekst + CTA</h4>
    <p class="f">Light / Italic / <b>Medium (kun CTA)</b></p>
    <p class="m">14–22 px · mono til koder</p>
  </div>
</div></body></html>
