<!doctype html>
<html lang="no"><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#F1EDE2;color:#31261D;font-family:var(--kl-sans);}
.wrap{padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.card{border-radius:var(--kl-radius-lg);overflow:hidden;padding:18px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;}
.a{background:#F8C1B8;}
.b{background:#DCE261;}
.card h3{font-family:var(--kl-serif);font-weight:400;font-size:24px;line-height:1.12;margin:0;}
.card p{font-weight:300;font-size:14px;line-height:1.45;margin:6px 0 0;max-width:28ch;}
.meta{font:var(--kl-overline);letter-spacing:.14em;}
</style></head>
<body><div class="wrap">
  <div class="card a">
    <div class="meta">Uke 17 · tirsdag</div>
    <div>
      <h3>Reinsdyr med beter og <em>sopp</em></h3>
      <p>Mørbrad fra Stensaas på Røros. 30 min fra pakke til bord.</p>
    </div>
  </div>
  <div class="card b">
    <div class="meta">Forrett</div>
    <div>
      <h3>VAAG sjøkreps med jordskokk</h3>
      <p>Fersk fra Haugesund. Pureert, stekt, toppet med gressløkolje.</p>
    </div>
  </div>
</div></body></html>
