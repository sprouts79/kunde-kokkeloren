<!doctype html>
<html lang="no"><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#F1EDE2;color:#31261D;font-family:var(--kl-sans);}
.wrap{padding:20px 24px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
.block{background:#EAE4D4;border-radius:var(--kl-radius-md);padding:18px;}
h4{font:var(--kl-overline);letter-spacing:.14em;margin:0 0 10px;}
.icons{display:flex;gap:16px;align-items:center;}
.icons img{width:28px;height:28px;}
.lucide{stroke:#31261D;stroke-width:1.5;fill:none;width:28px;height:28px;}
.sub{font:var(--kl-caption);color:var(--kl-muted);margin-top:8px;}
</style></head>
<body><div class="wrap">
  <div class="block">
    <h4>Sosiale · kilde</h4>
    <div class="icons">
      <img src="../assets/icons/facebook.svg" alt="Facebook">
      <img src="../assets/icons/instagram.svg" alt="Instagram">
    </div>
    <div class="sub">Monokrome SVG i Black. Fra Figma.</div>
  </div>
  <div class="block">
    <h4>UI · substitusjon</h4>
    <div class="icons">
      <svg class="lucide" viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      <svg class="lucide" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <svg class="lucide" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <svg class="lucide" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>
    </div>
    <div class="sub">Lucide · stroke 1.5 · <em>flagget</em></div>
  </div>
</div></body></html>
