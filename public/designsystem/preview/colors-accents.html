<!doctype html>
<html lang="no"><head><meta charset="utf-8"><title>Colors — accents</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--kl-sans);}
  .wrap{padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .sw{border-radius:var(--kl-radius-md);padding:14px;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;color:#31261D;}
  .name{font:var(--kl-overline);letter-spacing:.14em;text-transform:uppercase;}
  .hex{font:var(--kl-caption);font-family:var(--kl-mono);}
</style></head>
<body><div class="wrap">
  <div class="sw" style="background:#6CC24A"><div class="name">Green</div><div class="hex">#6CC24A</div></div>
  <div class="sw" style="background:#FFC72C"><div class="name">Yellow</div><div class="hex">#FFC72C</div></div>
  <div class="sw" style="background:#DB864E"><div class="name">Dark Orange</div><div class="hex">#DB864E</div></div>
  <div class="sw" style="background:#FF9E1B"><div class="name">Orange</div><div class="hex">#FF9E1B</div></div>
  <div class="sw" style="background:#F8C1B8"><div class="name">Pink</div><div class="hex">#F8C1B8</div></div>
  <div class="sw" style="background:#A7D8E7"><div class="name">Blue</div><div class="hex">#A7D8E7</div></div>
  <div class="sw" style="background:#B79B68"><div class="name">Brown</div><div class="hex">#B79B68</div></div>
  <div class="sw" style="background:#DCE261"><div class="name">Curry</div><div class="hex">#DCE261</div></div>
  <div class="sw" style="background:#FF6720"><div class="name">Red</div><div class="hex">#FF6720</div></div>
</div></body></html>
