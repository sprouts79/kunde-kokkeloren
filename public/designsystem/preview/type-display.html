<!doctype html>
<html lang="no"><head><meta charset="utf-8"><title>Type — display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>html,body{margin:0;background:#F1EDE2;color:#31261D;}
.wrap{padding:22px 24px;}
.row{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;}
.label{font:var(--kl-caption);font-family:var(--kl-mono);color:var(--kl-muted);min-width:70px;}
.d1{font:var(--kl-display-1);letter-spacing:-0.02em;margin:0;}
.d2{font:var(--kl-display-2);letter-spacing:-0.015em;margin:0;}
.note{font:var(--kl-caption);color:var(--kl-muted);margin-top:10px;}
</style></head>
<body><div class="wrap">
  <div class="row"><div class="label">96 / 1.02</div><h1 class="d1">Endelig,</h1></div>
  <div class="row"><div class="label">72 / 1.05</div><h1 class="d2">tid for <em>matkasse</em></h1></div>
  <div class="note">Valizas Regular + Italic. Italic reserveres for sitater og enkeltord. Letter-spacing strammes i display.</div>
</div></body></html>
