<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kokkeløren Design System</title>
<link rel="stylesheet" href="designsystem/colors_and_type.css">
<style>
:root {
  --shell-bg: #F1EDE2;
  --sidebar-bg: #EAE4D4;
  --sidebar-width: 260px;
  --header-height: 56px;
  --hairline: rgba(49, 38, 29, 0.14);
  --muted: rgba(49, 38, 29, 0.6);
  --muted-soft: rgba(49, 38, 29, 0.4);
  --ink: #31261D;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--kl-sans);
  background: var(--shell-bg);
  color: var(--ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ─────────────────────────────────────────────── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  height: var(--header-height);
  padding: 0 24px;
  border-bottom: 1px solid var(--hairline);
  background: var(--shell-bg);
  position: relative; z-index: 5;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.header-back {
  font-size: 12px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase;
  text-decoration: none; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px;
  transition: color 0.18s var(--kl-ease);
}
.header-back::before { content: "←"; font-size: 14px; }
.header-back:hover { color: var(--ink); }
.header-divider { width: 1px; height: 20px; background: var(--hairline); }
.header-title {
  font-family: var(--kl-serif); font-weight: 400;
  font-size: 18px; letter-spacing: -0.01em;
}
.header-title em { font-style: italic; opacity: 0.7; }

/* Toggle */
.toggle {
  display: inline-flex; align-items: center; gap: 0;
  background: var(--sidebar-bg);
  border-radius: 999px;
  padding: 4px;
  border: 1px solid var(--hairline);
}
.toggle-btn {
  font-family: var(--kl-sans); font-weight: 500;
  font-size: 12px; letter-spacing: 0.02em;
  background: transparent; color: var(--muted);
  border: 0; cursor: pointer;
  padding: 6px 14px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.18s var(--kl-ease);
}
.toggle-btn svg { width: 14px; height: 14px; }
.toggle-btn[aria-pressed="true"] {
  background: var(--ink); color: var(--shell-bg);
}

/* ── SHELL ──────────────────────────────────────────────── */
.shell {
  display: flex;
  height: calc(100vh - var(--header-height));
}

/* ── SIDEBAR ────────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--hairline);
  overflow-y: auto;
  padding: 16px 0 24px;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 3px; }

.nav-section { padding: 8px 0; }
.nav-label {
  font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted-soft);
  padding: 8px 24px 6px;
}
.nav-item {
  display: block;
  padding: 8px 24px;
  font-size: 14px; font-weight: 400;
  text-decoration: none;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s var(--kl-ease);
  border-left: 3px solid transparent;
}
.nav-item:hover {
  color: var(--ink);
  background: rgba(49, 38, 29, 0.05);
}
.nav-item.active {
  color: var(--ink);
  font-weight: 500;
  background: var(--shell-bg);
  border-left-color: var(--ink);
}

/* ── STAGE ──────────────────────────────────────────────── */
.stage {
  flex: 1;
  min-width: 0;
  display: flex; align-items: stretch; justify-content: center;
  background: var(--shell-bg);
  padding: 24px;
  overflow: hidden;
}
.stage-mobile-wrap {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.frame-shell {
  background: #fff;
  border-radius: 16px;
  border: 1px solid var(--hairline);
  box-shadow: var(--kl-shadow-soft);
  overflow: hidden;
  display: flex; flex-direction: column;
  width: 100%;
  height: 100%;
  transition: max-width 0.24s var(--kl-ease), max-height 0.24s var(--kl-ease);
}
.frame-shell.is-mobile {
  max-width: 390px;
  max-height: 844px;
  margin-top: 0;
}

.frame-chrome {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px;
  background: var(--ink);
  color: var(--shell-bg);
  font: 300 11px/1.2 var(--kl-mono, ui-monospace, Menlo, monospace);
  letter-spacing: 0.04em;
}
.frame-chrome .dots { display: inline-flex; gap: 5px; }
.frame-chrome .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(241,237,226,0.3); }
.frame-chrome .url { opacity: 0.7; flex: 1; text-align: center; padding: 0 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frame-chrome .device { opacity: 0.5; font-size: 10px; }

.frame-iframe {
  flex: 1;
  width: 100%;
  border: 0;
  background: #fff;
  display: block;
}

/* ── EMPTY ──────────────────────────────────────────────── */
.empty {
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px;
  color: var(--muted-soft);
  font-size: 14px;
  text-align: center;
}
.empty h3 { font-family: var(--kl-serif); font-size: 32px; font-weight: 400; color: var(--muted); margin: 0; }

/* ── RESPONSIVE ─────────────────────────────────────────── */
@media (max-width: 800px) {
  .sidebar { width: 200px; }
  .stage { padding: 12px; }
  .frame-shell.is-mobile { max-height: 700px; }
  .header-title { font-size: 15px; }
}
@media (max-width: 600px) {
  html, body { overflow: auto; }
  .shell { flex-direction: column; height: auto; min-height: calc(100vh - var(--header-height)); }
  .sidebar { width: 100%; height: auto; border-right: 0; border-bottom: 1px solid var(--hairline); max-height: 200px; }
  .stage { padding: 8px; min-height: 70vh; }
  .frame-shell { height: 70vh; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <a href="/" class="header-back">Kundeområde</a>
    <span class="header-divider"></span>
    <span class="header-title">Designsystem</span>
  </div>
  <div class="header-right" style="display:flex;align-items:center;gap:14px">
    <span data-status-mount></span>
    <div class="toggle" role="group" aria-label="Visningsmodus">
    <button class="toggle-btn" data-mode="desktop" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></svg>
      Desktop
    </button>
    <button class="toggle-btn" data-mode="mobile" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>
      Mobil
    </button>
    </div>
  </div>
</header>

<div class="shell">

  <aside class="sidebar">

    <div class="nav-section">
      <div class="nav-label">Brand</div>
      <a class="nav-item" data-src="designsystem/preview/brand-logo.html">Logo</a>
      <a class="nav-item" data-src="designsystem/preview/brand-mascot.html">Maskot</a>
      <a class="nav-item" data-src="designsystem/preview/brand-imagery.html">Bildebruk</a>
      <a class="nav-item" data-src="designsystem/preview/brand-iconography.html">Iconography</a>
    </div>

    <div class="nav-section">
      <div class="nav-label">Farger</div>
      <a class="nav-item" data-src="designsystem/preview/colors-primary.html">Primær</a>
      <a class="nav-item" data-src="designsystem/preview/colors-accents.html">Aksenter</a>
      <a class="nav-item" data-src="designsystem/preview/colors-usage.html">Bruk</a>
    </div>

    <div class="nav-section">
      <div class="nav-label">Typografi</div>
      <a class="nav-item" data-src="designsystem/preview/type-families.html">Familier</a>
      <a class="nav-item" data-src="designsystem/preview/type-display.html">Display</a>
      <a class="nav-item" data-src="designsystem/preview/type-headings.html">Overskrifter</a>
      <a class="nav-item" data-src="designsystem/preview/type-body.html">Brødtekst</a>
    </div>

    <div class="nav-section">
      <div class="nav-label">Form</div>
      <a class="nav-item" data-src="designsystem/preview/spacing.html">Spacing</a>
      <a class="nav-item" data-src="designsystem/preview/radii.html">Radius</a>
      <a class="nav-item" data-src="designsystem/preview/shadow.html">Skygger</a>
    </div>

    <div class="nav-section">
      <div class="nav-label">Komponenter</div>
      <a class="nav-item" data-src="designsystem/preview/component-cta.html">CTA</a>
      <a class="nav-item" data-src="designsystem/preview/component-cards.html">Kort</a>
      <a class="nav-item" data-src="designsystem/preview/component-stickers.html">Stickers</a>
      <a class="nav-item" data-src="designsystem/preview/component-form.html">Skjema</a>
    </div>

    <div class="nav-section">
      <div class="nav-label">UI-kits</div>
      <a class="nav-item" data-src="designsystem/ui_kits/email/index.html">E-postkit</a>
      <a class="nav-item" data-src="designsystem/ui_kits/web/index.html">Web-kit</a>
    </div>

  </aside>

  <main class="stage">
    <div class="stage-mobile-wrap">
      <div class="frame-shell" id="frame-shell">
        <div class="frame-chrome">
          <span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
          <span class="url" id="frame-url">designsystem / oversikt</span>
          <span class="device" id="frame-device">DESKTOP</span>
        </div>
        <iframe class="frame-iframe" id="preview-frame" src="" title="Designsystem preview"></iframe>
      </div>
    </div>
  </main>

</div>

<script>
(function() {
  const items = document.querySelectorAll('.nav-item');
  const iframe = document.getElementById('preview-frame');
  const urlLabel = document.getElementById('frame-url');
  const deviceLabel = document.getElementById('frame-device');
  const shell = document.getElementById('frame-shell');
  const toggleButtons = document.querySelectorAll('.toggle-btn');

  function setActive(item) {
    items.forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    const src = item.dataset.src;
    iframe.src = src;
    urlLabel.textContent = src.replace('designsystem/', '').replace('.html', '').replace(/\//g, ' / ');
  }

  function setMode(mode) {
    toggleButtons.forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode ? 'true' : 'false'));
    if (mode === 'mobile') {
      shell.classList.add('is-mobile');
      deviceLabel.textContent = 'MOBIL · 390 × 844';
    } else {
      shell.classList.remove('is-mobile');
      deviceLabel.textContent = 'DESKTOP';
    }
  }

  items.forEach(item => {
    item.addEventListener('click', (e) => {
      e.preventDefault();
      setActive(item);
    });
  });

  toggleButtons.forEach(btn => {
    btn.addEventListener('click', () => setMode(btn.dataset.mode));
  });

  // Initial: åpne første nav-item (Logo)
  if (items.length > 0) setActive(items[0]);
})();
</script>

<script src="/assets/page-status.js"></script>

</body>
</html>
